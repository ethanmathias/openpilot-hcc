# Who is who on the HCC V2V network, and the defaults for a run.
#
# This file replaces the --ego_host / --user / --remote_dir / --relay_port /
# --device_id flags that had to be retyped on every command, and the
# ~/.openpilot_hcc_field_test.json the GUI used to stash them in. Every `hcc`
# subcommand reads it, and every value can still be overridden by a flag.
#
# Keep it in version control: the addresses ARE the test setup, and a run that
# cannot be reproduced from the repo is not reproducible.

[network]
# The relay runs on the machine that serves the hotspot. Since 2026-11-18 that
# is the Linux VM in LinkLab/wn722n-ap driving a USB radio on the Mac, not the
# ego. 10.57.0.1 is the VM's wlan0 address and the subnet's gateway.
#
# The pedal publisher runs on the Mac, which is NOT on this subnet, and reaches
# the relay through the VM's UDP forward on 127.0.0.1:19090 instead.
#
# The subnet moved from 10.42.0.0/24 to 10.57.0.0/24 on 2026-11-18: the phone
# hotspot "iphone2" also hands out 10.42.0.0/24 with gateway .1, so the two
# networks were indistinguishable by address.
relay_host = "10.57.0.1"
relay_port = 19090
send_hz = 50.0

[relay]
# Where the relay process actually runs, and how to reach it over SSH to pull
# its log. Distinct from network.relay_host, which is the address peers send
# packets TO. Since 2026-11-18 both point at the AP VM.
host = "linklab-ap"
user = "ap"
log_dir = "/home/ap/hcc-logs"

[ego]
host = "10.57.0.198"
user = "comma"
repo = "/data/openpilot"
device_id = "hcc-ego"

[lead]
# The lead-vehicle publisher: a Raspberry Pi on the hotspot. It does NOT run
# openpilot -- `repo` is the ~100 KB bundle that device/deploy_lead.sh ships,
# pure stdlib, no devices.toml of its own. This file stays the single source
# of truth; `hcc run` passes the relay address, port, device id and rate as
# flags.
host = "10.57.0.90"
user = "linklab"
repo = "/home/linklab/hcc-lead"
device_id = "hcc-lead"
python = "python3"
log_dir = "/home/linklab/hcc-logs"


[pedal]
# The laptop reading the pedal rig. It has no SSH role -- it runs the publisher
# locally -- so only its identity on the wire and its axis mapping live here.
#
# A 3-pedal rig exposes several axes in no documented order, and a swapped
# throttle and brake still produces a plausible-looking trace. Measure the
# mapping with `hcc pedal --identify` and record it here.
device_id = "hcc-pedals"
stale_ms = 150
# Measured with `hcc pedal --identify` on 2026-11-17: the throttle holds a
# clean +1.000 on axis 0, and the load-cell brake holds about +0.507 on axis 1,
# which is ~75% of travel and normal for a load cell under foot force.
# Re-measure if the rig is swapped or re-flashed -- a reversed mapping produces
# a perfectly plausible trace and is only found when the car accelerates into
# a brake press.
throttle_axis = 0
brake_axis = 1

[run]
# Defaults for `hcc run`; override per run with flags.
scenario = 48
max_speed_mph = 35.0
monitor_hz = 10.0
remote_log_dir = "/data/hcc_v2v_logs"
